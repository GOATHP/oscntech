# OSC&TECH 관리자 페이지 설정 (Decap CMS)
# 배포 후: repo 값을 실제 GitHub 저장소 이름으로 바꾸고 로그인(OAuth)을 연결해야 해요.
backend:
  name: github
  repo: GOATHP/oscntech
  branch: main
  commit_messages:
    update: '관리자 수정: {{collection}} / {{slug}}'

# 내 컴퓨터에서 테스트할 때: 터미널 하나 더 열고 `npx decap-server` 실행 후 /admin 접속
local_backend: true

locale: ko
media_folder: public/images
public_folder: /images

collections:
  - name: settings
    label: 사이트 내용
    editor: { preview: false }
    files:
      - name: site
        label: 회사 정보 (주소, 연락처)
        file: src/data/site.json
        fields:
          - { name: name, label: 회사명 (영문), widget: string }
          - { name: nameKo, label: 회사명 (한글), widget: string }
          - { name: tagline, label: 한 줄 소개, widget: string }
          - { name: head, label: 본사 주소, widget: string }
          - { name: factory, label: 공장 주소, widget: string }
          - { name: tel, label: 전화번호, widget: string }
          - { name: email, label: 이메일, widget: string }
          - { name: hours, label: 상담시간, widget: string }

      - name: pages
        label: 메인 · 인사말 · 사업분야
        file: src/data/pages.json
        fields:
          - name: home
            label: 메인 화면
            widget: object
            fields:
              - { name: heroTitle, label: 메인 큰 문구 (줄바꿈 가능), widget: text }
              - { name: heroImage, label: 메인 배경 사진, widget: image, required: false }
              - { name: intro, label: 회사소개 요약 문단, widget: text }
          - name: greeting
            label: 인사말
            widget: object
            fields:
              - { name: lead, label: 강조 문구, widget: string }
              - { name: body, label: 본문 (빈 줄로 문단 구분), widget: text }
              - { name: ceo, label: 대표 이름, widget: string }
              - { name: image, label: 사진, widget: image, required: false }
          - name: business
            label: 사업분야
            widget: object
            fields:
              - name: areas
                label: 사업분야 목록
                label_singular: 사업분야
                widget: list
                fields:
                  - { name: title, label: 제목, widget: string }
                  - { name: desc, label: 설명, widget: text }
                  - { name: image, label: 사진, widget: image, required: false }
              - name: steps
                label: 진행 절차
                widget: list
                field: { name: step, label: 단계, widget: string }

      - name: products
        label: 공급제품
        file: src/data/products.json
        fields:
          - name: products
            label: 제품 분류
            label_singular: 제품 분류
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: 분류 이름, widget: string }
              - { name: slug, label: 주소 (영문 소문자, 예 powder), widget: string, pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, - 만 쓸 수 있어요'] }
              - { name: summary, label: 설명, widget: text }
              - { name: image, label: 대표 사진, widget: image, required: false }
              - name: items
                label: 세부 제품
                widget: list
                field: { name: item, label: 제품명, widget: string }

      - name: references
        label: 공급실적
        file: src/data/references.json
        fields:
          - name: references
            label: 실적 목록
            label_singular: 실적
            widget: list
            summary: '{{fields.year}} · {{fields.client}} · {{fields.project}}'
            fields:
              - { name: year, label: 연도, widget: string }
              - { name: client, label: 고객사, widget: string }
              - { name: project, label: 납품 설비, widget: string }
              - { name: note, label: 비고, widget: string, required: false }

      - name: certifications
        label: 인증현황
        file: src/data/certifications.json
        fields:
          - name: certifications
            label: 인증서 목록
            label_singular: 인증서
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: 인증서 이름, widget: string }
              - { name: issuer, label: 발급 기관, widget: string }
              - { name: date, label: 날짜, widget: string }
              - { name: image, label: 인증서 사진, widget: image, required: false }
